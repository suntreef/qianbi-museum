name: 构建并发布 Docker 镜像

on:
  push:
    tags: ["v*"]          # 推送 v 开头的 tag 时构建发布（如 v0.6.4）
    branches: [main]      # main 分支更新时同步 latest
  workflow_dispatch:      # 支持手动触发

env:
  REGISTRY: ghcr.io
  IMAGE: ghcr.io/suntreef/qianbi-museum

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3     # 跨架构模拟（ARM NAS）

      - uses: docker/setup-buildx-action@v3

      - name: 登录 ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 计算镜像标签
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}      # v0.6.4 → 0.6.4
            type=raw,value=latest,enable={{is_default_branch}}

      - name: 构建并推送（amd64 + arm64）
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
