<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>钱币博物馆 · 藏品入库</title>
<link rel="stylesheet" href="/static/app.css">
</head>
<body>
<header class="topbar">
  <span class="logo">🏛️ 钱币博物馆</span>
  <nav>
    {% if user %}
    <a href="/capture">采集</a>
    <a href="/items">藏品</a>
    {% if user.role in ('admin', 'staff') %}<a href="/inventory">盘点</a>{% endif %}
    {% if user.role == 'admin' %}<a href="/locations">库位</a><a href="/dict">字典</a><a href="/users">用户</a>{% endif %}
    <span class="who">{{ user.username }}（{{ {'admin':'管理员','staff':'录入','viewer':'只读'}[user.role] }}）</span>
    <a href="#" onclick="fetch('/api/logout',{method:'POST'}).finally(()=>location='/login')">退出</a>
    {% endif %}
  </nav>
</header>
<main>{% block content %}{% endblock %}</main>
</body>
</html>
