{% extends "base.html" %}
{% block content %}
<h2>批量识别</h2>
<p class="hint">存量录入利器：一次选 ≤60 张评级标签照片上传，关掉手机，
NAS 后台限速慢慢识别（约 4~5 秒/张）。回来在这里看进度，
完成后到「藏品 → 状态筛选：草稿」逐件核对入库。</p>
<section class="filters addrow">
  <label class="btnlink" style="flex:1;text-align:center">📷 选择照片上传（≤60张/次）
    <input type="file" accept="image/*" multiple hidden id="fileInput">
  </label>
</section>
<div id="jobs"></div>
<details id="jobDetail" hidden>
  <summary id="detailSummary"></summary>
  <table id="items"><thead><tr><th>文件</th><th>状态</th><th>说明</th></tr></thead><tbody></tbody></table>
</details>

<script>
const $ = s => document.querySelector(s);
const ST = {pending:'⏳排队', ok:'✅已识别', dup:'⚠️重复', fail:'❌失败'};
const esc = s => String(s ?? '').replace(/[&<>"']/g,
  c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let currentJob = null, timer = null;

async function j(url, opt){
  const r = await fetch(url, opt);
  if(r.status===401) return location='/login';
  if(r.status===403){ alert('权限不够'); return null; }
  return r.json();
}

async function load(){
  const jobs = await j('/api/batch');
  const box = $('#jobs');
  box.innerHTML = jobs.map(b => {
    const pct = b.total ? Math.round(b.done / b.total * 100) : 0;
    return `<div class="card">
      <div class="card-head"><b>任务 #${b.id}</b>
        <span class="hint">${b.created_at} · ${b.created_by||''} · ${b.status==='running'?'进行中':'已完成'}</span></div>
      <div class="pbar"><div class="pfill" style="width:${pct}%"></div></div>
      <p class="hint">已处理 ${b.done}/${b.total}：识别 ${b.ok} · 重复拦截 ${b.dup} · 失败 ${b.fail}
        <a href="#" onclick="showDetail(${b.id});return false">明细</a>
        ${b.status==='running' && b.done >= b.total ? '' : ''}
        <a href="/items?__draft=1">去确认草稿</a></p>
    </div>`;
  }).join('') || '<p class="hint">还没有批量任务</p>';
  if(timer) clearTimeout(timer);
  if(jobs.some(b => b.status === 'running')) timer = setTimeout(load, 3000);
}

async function showDetail(id){
  const d = await j('/api/batch/' + id);
  if(!d) return;
  currentJob = id;
  $('#detailSummary').innerHTML = `任务 #${id} 明细
    <label class="btnlink" style="cursor:pointer;margin-left:10px">➕ 追加照片（≤60张）
      <input type="file" accept="image/*" multiple hidden id="appendInput"></label>
    <a class="btnlink" href="/items?__draft=1" style="margin-left:8px">去确认草稿</a>`;
  $('#items tbody').innerHTML = d.items.map(it =>
    `<tr><td>${esc(it.filename)}</td><td>${ST[it.status]||it.status}</td><td>${esc(it.message)}</td></tr>`).join('');
  const ap = document.getElementById('appendInput');
  if(ap) ap.onchange = async e => {
    const files = [...e.target.files].slice(0, 60);
    if(!files.length) return;
    const fd = new FormData();
    files.forEach(f => fd.append('files', f));
    const d2 = await j(`/api/batch/${id}/files`, {method:'POST', body: fd});
    if(d2 && d2.ok){ toast(`已追加 ${d2.queued} 张进入队列`); load(); showDetail(id); }
    e.target.value = '';
  };
  $('#jobDetail').hidden = false;
}

$('#fileInput').onchange = async e => {
  const files = [...e.target.files].slice(0, 60);
  if(!files.length) return;
  if(!confirm(`上传 ${files.length} 张开始批量识别？`)) { e.target.value=''; return; }
  const fd = new FormData();
  files.forEach(f => fd.append('files', f));
  const d = await j('/api/batch', {method:'POST', body: fd});
  if(d && d.ok){ toast(`已排队 ${d.queued} 张，任务 #${d.job_id} 开始后台识别`); load(); }
  e.target.value = '';
};

function toast(msg){
  const d = document.createElement('div');
  d.className = 'toast'; d.textContent = msg;
  document.body.appendChild(d);
  setTimeout(()=>d.remove(), 4000);
}
load();
</script>
{% endblock %}
