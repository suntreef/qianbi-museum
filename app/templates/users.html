{% extends "base.html" %}
{% block content %}
<div class="page-head"><h2>用户管理</h2><p class="sub">角色说明：<b>管理员</b>=全部权限（价格、导出、删除、字典、用户）；
<b>录入</b>=拍照录入、改藏品信息（看不到价格和估值）；<b>只读</b>=仅浏览（看不到价格）。</p></div>
<div class="filters addrow">
  <input class="input" id="username" placeholder="用户名" style="width:150px">
  <input class="input" id="password" placeholder="初始口令" style="width:150px">
  <select class="input" id="role">
    <option value="staff">录入</option>
    <option value="admin">管理员</option>
    <option value="viewer">只读</option>
  </select>
  <button class="btn primary" id="addBtn">➕ 添加用户</button>
</div>
<table id="tbl">
  <thead><tr><th>用户名</th><th>角色</th><th>状态</th><th>创建时间</th><th>操作</th></tr></thead>
  <tbody></tbody>
</table>

<script>
const $ = s => document.querySelector(s);
const ROLE = {admin:'管理员', staff:'录入', viewer:'只读'};

async function j(url, opt){
  const r = await fetch(url, opt);
  if(r.status===401) return location='/login';
  if(r.status===403){ alert('权限不够'); return null; }
  return r.json();
}
function toast(msg){
  const d = document.createElement('div');
  d.className = 'toast'; d.textContent = msg;
  document.body.appendChild(d);
  setTimeout(()=>d.remove(), 3000);
}

async function load(){
  const list = await j('/api/users');
  const tb = $('#tbl tbody');
  tb.innerHTML = '';
  for(const u of list){
    const tr = document.createElement('tr');
    tr.innerHTML = `<td>${u.username}</td>
      <td><select onchange="changeRole(${u.id}, this.value)">
        ${Object.entries(ROLE).map(([k,v]) =>
          `<option value="${k}" ${u.role===k?'selected':''}>${v}</option>`).join('')}
      </select></td>
      <td>${u.disabled ? '<span class="warn">已停用</span>' : '正常'}</td>
      <td>${u.created_at||''}</td>
      <td>
        <button class="mini" onclick="resetPw(${u.id}, '${u.username}')">改口令</button>
        <button class="mini" onclick="toggleDisable(${u.id}, ${u.disabled?0:1})">${u.disabled?'启用':'停用'}</button>
        <button class="mini" onclick="delUser(${u.id}, '${u.username}')">删</button>
      </td>`;
    tb.appendChild(tr);
  }
}
window.changeRole = async (id, role) => {
  const d = await j('/api/users/' + id, {method:'PUT',
    headers:{'Content-Type':'application/json'}, body: JSON.stringify({role})});
  if(d) toast('已修改');
};
window.resetPw = async (id, name) => {
  const pw = prompt(`给「${name}」设置新口令：`);
  if(!pw) return;
  const d = await j('/api/users/' + id, {method:'PUT',
    headers:{'Content-Type':'application/json'}, body: JSON.stringify({password: pw})});
  if(d) toast('口令已更新');
};
window.toggleDisable = async (id, disable) => {
  const d = await j('/api/users/' + id, {method:'PUT',
    headers:{'Content-Type':'application/json'}, body: JSON.stringify({disabled: !!disable})});
  if(d) load();
};
window.delUser = async (id, name) => {
  if(!confirm(`删除用户「${name}」？`)) return;
  const d = await j('/api/users/' + id, {method:'DELETE'});
  if(d) load();
};
$('#addBtn').onclick = async () => {
  if(!$('#username').value.trim() || !$('#password').value) return alert('用户名和口令必填');
  const d = await j('/api/users', {method:'POST',
    headers:{'Content-Type':'application/json'},
    body: JSON.stringify({username: $('#username').value.trim(),
      password: $('#password').value, role: $('#role').value})});
  if(d){ toast('已添加'); $('#username').value=''; $('#password').value=''; load(); }
};
load();
</script>
{% endblock %}
