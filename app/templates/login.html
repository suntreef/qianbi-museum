{% extends "base.html" %}
{% block content %}
<div class="login">
  <h2>藏品入库系统</h2>
  {% if error %}<p class="warn">{{ error }}</p>{% endif %}
  <form method="post" action="/login">
    <input type="password" name="password" placeholder="访问口令" required autofocus>
    <button class="bigbtn primary" type="submit">进入</button>
  </form>
  <p class="hint">首次部署请修改 docker-compose.yml 里的 APP_PASSWORD</p>
</div>
{% endblock %}
