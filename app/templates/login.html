{% extends "base.html" %}
{% block content %}
<div class="login">
  <div class="seal-big">{{ site.char or '泉' }}</div>
  <h2>{{ site.name }}</h2>
  <p class="sub">— 藏 品 入 库 —</p>
  {% if error %}<p class="warn">{{ error }}</p>{% endif %}
  <form method="post" action="/login">
    <input class="input" name="username" placeholder="用户名" required autofocus>
    <input class="input" type="password" name="password" placeholder="口令" required>
    <button class="btn primary" type="submit">进入</button>
  </form>
  <p class="hint">首次部署：管理员账号 admin，口令为 docker-compose.yml 里的 APP_PASSWORD（请务必修改）。<br>
  员工账号由管理员在「用户」页创建。</p>
</div>
{% endblock %}
