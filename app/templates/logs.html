{% extends "base.html" %}
{% block content %}
<h2>全局操作日志</h2>
<p class="hint">最近 200 条：入库、状态变更、位置变更等全程留痕。</p>
<table>
  <thead><tr><th>时间</th><th>编号</th><th>名称</th><th>事件</th><th>详情</th><th>经手人</th></tr></thead>
  <tbody id="tb"></tbody>
</table>

<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g,
  c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
fetch('/api/events').then(r => {
  if(r.status===401) return location='/login';
  return r.json();
}).then(list => {
  document.querySelector('#tb').innerHTML = list.map(e =>
    `<tr><td>${e.created_at||''}</td>
     <td>${e.item_code ? `<a href="/items/${e.item_id}">${esc(e.item_code)}</a>` : ''}</td>
     <td>${esc(e.name)}</td><td>${esc(e.kind)}</td>
     <td>${esc(e.detail)}</td><td>${esc(e.operator)}</td></tr>`).join('');
});
</script>
{% endblock %}
