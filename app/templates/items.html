{% extends "base.html" %}
{% block content %}
<div class="page-head">
  <div class="page-head-left">
    <h2>馆藏数字总库</h2>
    <div class="sub">多维检索、品相评级核验与库位台账管理</div>
  </div>
  {% if user and user.role == 'admin' %}
  <div class="page-actions">
    <a class="btn ghost sm" href="#" id="exportBtn">⬇️ 导出筛选台账</a>
    <a class="btn ghost sm" href="/api/export/register" download>📋 总登记账</a>
    <a class="btn ghost sm" href="#" id="importBtn">⬆️ 导入 Excel</a>
    <input type="file" id="importFile" accept=".xlsx" hidden>
    <a class="btn dark sm" href="/api/backup/db" download>💾 备份数据库</a>
  </div>
  {% endif %}
</div>

<section class="statsbar" id="statsbar"></section>

<section class="filter-panel" id="filterPanel">
  <div class="filters">
    <input class="input grow" id="q" placeholder="🔍 搜索名称 / 发行机构 / 馆内编号 / 冠字号 / 备注…">
    <button class="btn primary" id="go">查询</button>
    <button class="btn sm" id="dimsToggle" style="display:none">筛选 ▾</button>
  </div>
  <div class="filters dims" id="dims">
    <select class="input" id="fCategory"><option value="">全部品类</option></select>
    <select class="input" id="fSeries"><option value="">全部系列</option></select>
    <select class="input" id="fStatus">
      <option value="">全部状态</option>
      <option value="draft">草稿</option><option value="in_stock">在库</option>
      <option value="reviewing">送评中</option><option value="exhibited">展出中</option>
      <option value="lent">借出</option><option value="lost">丢失</option>
      <option value="retired">注销</option>
    </select>
    <select class="input" id="fLevel"><option value="">全部等级</option></select>
    <select class="input" id="fLocation"><option value="">全部库位</option><option value="none">未入库位</option></select>
    <input class="input num-w" id="yFrom" type="number" placeholder="起始年">
    <input class="input num-w" id="yTo" type="number" placeholder="截止年">
    <select class="input" id="fsort">
      <option value="">排序：最新录入</option>
      <option value="old">排序：录入先后</option>
      <option value="year">排序：年份 ↑</option>
      <option value="year_desc">排序：年份 ↓</option>
      <option value="value">排序：估值 ↓</option>
      <option value="code">排序：编号 ↑</option>
    </select>
  </div>

  <div class="filter-bar-bottom">
    <div class="hint">
      <strong id="total" style="color:var(--ink)">加载中…</strong>
      <span style="margin:0 8px;opacity:.3">|</span>
      <a href="#" id="needPhotosLink">📸 待补拍清单</a>
    </div>
    <div class="view-switch" id="viewSwitch">
      <button type="button" data-view="cards">🏛 画廊展柜</button>
      <button type="button" data-view="table">📑 紧凑台账</button>
    </div>
  </div>
</section>

<section id="needPhotos" hidden style="margin-bottom:16px"></section>

<div id="listContainer" class="view-mode-cards">
  <!-- 画廊展柜视图：曜石黑底托大图卡片 -->
  <div id="cards" class="cards"></div>

  <!-- 紧凑台账视图：带微缩图的高密度数据表 -->
  <div class="tblwrap">
    <table id="tbl">
      <thead><tr>
        <th style="width:54px">影像</th>
        <th>编号</th><th>藏品名称</th><th>品类 / 系列</th><th>发行机构 / 券种</th>
        <th>纪年</th><th>评级</th><th>状态</th>
      </tr></thead>
      <tbody></tbody>
    </table>
  </div>
</div>

<div class="pager" id="pager"></div>

<script>
const $ = s => document.querySelector(s);
const STATUS = {draft:'草稿', in_stock:'在库', reviewing:'送评中', exhibited:'展出中',
  lent:'借出', retired:'注销', consigned:'寄售(历史)', sold:'已售(历史)', lost:'丢失'};
const PAGE = 50;
let page = 0, lastData = null;
const ADMIN = {{ 'true' if user and user.role == 'admin' else 'false' }};
const esc = s => String(s ?? '').replace(/[&<>"']/g,
  c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const chipHTML = s => `<span class="chip c-${esc(s)}">${STATUS[s]||esc(s)}</span>`;

// 视图切换逻辑（默认桌面端也优先展示画廊，且记住用户选择）
const listContainer = $('#listContainer');
const savedView = localStorage.getItem('qm_items_view') || (window.innerWidth >= 960 ? 'cards' : 'cards');
function setViewMode(mode){
  listContainer.className = 'view-mode-' + mode;
  localStorage.setItem('qm_items_view', mode);
  document.querySelectorAll('#viewSwitch button').forEach(b => {
    b.classList.toggle('active', b.dataset.view === mode);
  });
}
setViewMode(savedView);
document.querySelectorAll('#viewSwitch button').forEach(b => {
  b.onclick = () => setViewMode(b.dataset.view);
});

async function j(url, opt){
  const r = await fetch(url, opt);
  if(r.status===401) return location='/login';
  return r.json();
}

async function loadStats(){
  const s = await j('/api/stats');
  const np = await j('/api/needs-photos');
  let bar =
    card(s.total, '馆藏总数') +
    card(s.confirmed, '在库 / 展出') +
    card(s.draft, '草稿待确认', s.draft ? 'warn' : '') +
    card(np.count, '待补拍影像', np.count ? 'warn' : '') +
    card(s.photos, '高清影像(张)') +
    card(s.attachments || 0, '溯源凭证(份)') +
    card(s.pub_views || 0, '扫码导览人次', 'gold');
  if(s.est_total)
    bar += card('¥' + Number(s.est_total).toLocaleString(), '馆藏估值合计', 'gold');
  $('#statsbar').innerHTML = bar;
  function card(v, k, cls){
    return `<div class="stat-card ${cls||''}"><div class="v">${v}</div><div class="k">${k}</div></div>`;
  }
  const sec = $('#needPhotos'); sec.hidden = true; sec.dataset.loaded = '';
  $('#needPhotosLink').textContent = `📸 待补拍清单（${np.count}）`;
  $('#needPhotosLink').onclick = (e) => {
    e.preventDefault();
    sec.hidden = !sec.hidden;
    if(!sec.hidden && !sec.dataset.loaded){
      sec.innerHTML = np.items.map(it =>
        `<div class="needsrow">
          <div><a href="/items/${it.id}"><b>${esc(it.item_code) || ('草稿#'+it.id)}</b></a> · ${esc(it.name)}</div>
          <span class="chip c-lost">缺${it.missing.map(m=>m==='front'?'正面':'背面').join('、')}</span>
        </div>`
      ).join('') || '<div class="needsrow"><span class="hint">所有藏品正背面影像齐全</span></div>';
      sec.dataset.loaded = 1;
    }
  };
}

async function fill(sel, type){
  const list = await j('/api/dict/' + type);
  for(const d of list){
    const op = document.createElement('option');
    op.value = d.name; op.textContent = d.name;
    sel.appendChild(op);
  }
}
async function fillLocs(sel){
  const locs = await j('/api/locations');
  for(const l of locs){
    const op = document.createElement('option');
    op.value = l.id; op.textContent = (l.parent_id ? ' └ ' : '') + l.name;
    sel.appendChild(op);
  }
}

function renderCards(items){
  const box = $('#cards');
  box.innerHTML = '';
  if(!items.length){ box.innerHTML = '<div class="empty" style="grid-column:1/-1">没有找到符合筛选条件的藏品</div>'; return; }
  for(const it of items){
    const card = document.createElement('div');
    card.className = 'item-card';
    card.onclick = () => location = '/items/' + it.id;
    const thumb = it.thumb
      ? `<img class="thumb" src="${it.thumb}" loading="lazy" alt="">`
      : `<div class="thumb-empty">🪙<small>暂无影像</small></div>`;
    const gradeChip = it.grade_co
      ? `<span class="chip c-grade">${esc(it.grade_co + (it.grade_raw ? ' ' + it.grade_raw : ''))}</span>` : '<span></span>';
    const levelChip = it.level ? `<span class="chip c-level">${esc(it.level)}</span>` : '';
    const price = ADMIN && (it.est_value || it.purchase_price)
      ? `<span class="card-price">¥${Number(it.est_value || it.purchase_price).toLocaleString()}</span>` : '';
    const subInfo = [it.dynasty || it.category, it.bank, it.note_type].filter(Boolean).join(' · ');

    card.innerHTML = `
      <div class="stage">
        ${thumb}
        <div class="stage-badges">
          ${chipHTML(it.status)}
          ${gradeChip}
        </div>
      </div>
      <div class="body">
        <h3>${esc(it.name) || '未命名藏品'}</h3>
        <div class="card-code">${esc(it.item_code || ('#'+it.id))}${it.year_text ? ' · ' + esc(it.year_text) : ''}</div>
        <div class="card-meta">
          <span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:65%">${esc(subInfo) || '—'}</span>
          ${price || levelChip}
        </div>
      </div>`;
    box.appendChild(card);
  }
}

function renderTable(items){
  const tb = $('#tbl tbody');
  tb.innerHTML = '';
  if(!items.length){
    tb.innerHTML = '<tr><td colspan="8" class="empty">没有找到符合筛选条件的藏品</td></tr>';
    return;
  }
  for(const it of items){
    const tr = document.createElement('tr');
    tr.className = 'rowlink';
    tr.onclick = () => location = '/items/' + it.id;
    const miniImg = it.thumb
      ? `<img class="tbl-thumb" src="${it.thumb}" loading="lazy" alt="">`
      : `<div class="tbl-thumb-empty">🪙</div>`;
    const catSeries = [it.category, it.series].filter(Boolean).join(' / ');
    const gradeStr = (it.grade_co||'') + (it.grade_raw ? ' ' + it.grade_raw : '');
    tr.innerHTML = `
      <td>${miniImg}</td>
      <td class="num"><b>${esc(it.item_code || ('#'+it.id))}</b></td>
      <td><b>${esc(it.name) || '未命名'}</b></td>
      <td>${esc(catSeries)}</td>
      <td>${esc((it.bank||'') + (it.note_type ? ' ' + it.note_type : ''))}</td>
      <td class="num">${esc(it.year_text)}</td>
      <td>${gradeStr ? `<span class="chip c-grade">${esc(gradeStr)}</span>` : '—'}</td>
      <td>${chipHTML(it.status)}</td>`;
    tb.appendChild(tr);
  }
}

function render(){
  if(!lastData) return;
  renderCards(lastData.items);
  renderTable(lastData.items);
  const pages = Math.max(1, Math.ceil(lastData.total / PAGE));
  let html = '';
  if(pages > 1){
    if(page > 0) html += `<button class="mini" onclick="search(${page-1})">← 上一页</button> `;
    html += `<span class="mono">第 ${page+1} / ${pages} 页</span>`;
    if(page < pages-1) html += ` <button class="mini" onclick="search(${page+1})">下一页 →</button>`;
  }
  $('#pager').innerHTML = html;
}

async function search(p){
  if(p !== undefined) page = p;
  const params = new URLSearchParams();
  if($('#q').value) params.set('q', $('#q').value);
  if($('#fCategory').value) params.set('category', $('#fCategory').value);
  if($('#fSeries').value) params.set('series', $('#fSeries').value);
  if($('#fStatus').value) params.set('status', $('#fStatus').value);
  if($('#yFrom').value) params.set('year_from', $('#yFrom').value);
  if($('#yTo').value) params.set('year_to', $('#yTo').value);
  if($('#fLocation').value)
    params.set('location_id', $('#fLocation').value === 'none' ? -1 : $('#fLocation').value);
  if($('#fLevel').value) params.set('level', $('#fLevel').value);
  if($('#fsort').value) params.set('sort', $('#fsort').value);
  params.set('limit', PAGE);
  params.set('offset', page * PAGE);
  const d = await j('/api/items?' + params);
  $('#total').textContent = `共检索到 ${d.total} 件藏品`;
  lastData = d;
  render();
}
$('#go').onclick = () => search(0);
$('#q').onkeydown = e => { if(e.key==='Enter') search(0); };
['#fCategory','#fSeries','#fStatus','#fLevel','#fLocation','#fsort'].forEach(sel => {
  $(sel).onchange = () => search(0);
});

{% if user and user.role == 'admin' %}
$('#exportBtn').onclick = e => {
  e.preventDefault();
  const p = new URLSearchParams();
  if($('#q').value) p.set('q', $('#q').value);
  if($('#fCategory').value) p.set('category', $('#fCategory').value);
  if($('#fSeries').value) p.set('series', $('#fSeries').value);
  if($('#fStatus').value) p.set('status', $('#fStatus').value);
  if($('#yFrom').value) p.set('year_from', $('#yFrom').value);
  if($('#yTo').value) p.set('year_to', $('#yTo').value);
  if($('#fLocation').value)
    p.set('location_id', $('#fLocation').value === 'none' ? -1 : $('#fLocation').value);
  if($('#fsort').value) p.set('sort', $('#fsort').value);
  location.href = '/api/export/xlsx?' + p;
};
$('#importBtn').onclick = e => { e.preventDefault(); $('#importFile').click(); };
$('#importFile').onchange = async e => {
  const f = e.target.files[0];
  if(!f) return;
  if(!confirm('导入会跳过已存在的评级编号/内部编号，继续？')) { e.target.value=''; return; }
  const fd = new FormData();
  fd.append('file', f);
  const r = await fetch('/api/import/xlsx', {method:'POST', body: fd});
  if(r.status===401) return location='/login';
  const d = await r.json();
  if(d.ok){
    alert(`导入完成：新增 ${d.imported} 件，跳过 ${d.skipped} 件（已存在），失败 ${d.errors} 件`);
    search(page); loadStats();
  } else alert('导入失败：' + (d.detail || ''));
  e.target.value = '';
};
{% endif %}

Promise.all([fill($('#fCategory'),'category'), fill($('#fSeries'),'series'),
             fill($('#fLevel'),'item_level'), fillLocs($('#fLocation'))])
  .then(() => {
    // 平面格式图点击柜子 → ?location_id= 直达该柜藏品
    const urlLoc = new URLSearchParams(location.search).get('location_id');
    if(urlLoc) $('#fLocation').value = urlLoc;
    if(new URLSearchParams(location.search).get('q'))
      $('#q').value = new URLSearchParams(location.search).get('q');
    search(0); loadStats();
  });

// 手机端：维度筛选默认收起，点「筛选」展开
(function(){
  const btn = document.getElementById('dimsToggle'),
        dims = document.getElementById('dims');
  if(!btn || !dims) return;
  if(window.matchMedia('(max-width: 640px)').matches){
    btn.style.display = '';
    dims.style.display = 'none';
    btn.onclick = () => {
      const open = dims.style.display === 'none';
      dims.style.display = open ? 'flex' : 'none';
      btn.textContent = open ? '筛选 ▴' : '筛选 ▾';
    };
  }
})();
</script>
{% endblock %}
