{% extends "base.html" %}
{% block content %}
<div class="page-head"><h2>藏品检索</h2></div>
<section class="statsbar" id="statsbar"></section>
<section class="filters">
  <input class="input grow" id="q" placeholder="搜索：名称/机构/编号/备注…（≥3字走全文索引）">
  <select class="input" id="fCategory"><option value="">全部品类</option></select>
  <select class="input" id="fSeries"><option value="">全部系列</option></select>
  <select class="input" id="fStatus">
    <option value="">全部状态</option>
    <option value="draft">草稿</option><option value="in_stock">在库</option>
    <option value="reviewing">送评中</option><option value="exhibited">展出中</option>
    <option value="lent">借出</option><option value="lost">丢失</option>
    <option value="retired">注销</option>
  </select>
  <input class="input num-w" id="yFrom" type="number" placeholder="年份从">
  <input class="input num-w" id="yTo" type="number" placeholder="到">
  <select class="input" id="fsort">
    <option value="">最新录入</option>
    <option value="old">录入先后</option>
    <option value="year">年份 ↑</option>
    <option value="year_desc">年份 ↓</option>
    <option value="value">估值 ↓</option>
    <option value="code">编号 ↑</option>
  </select>
  <select class="input" id="fLevel"><option value="">全部等级</option></select>
  <select class="input" id="fLocation"><option value="">全部库位</option><option value="none">未入库位</option></select>
  <button class="btn primary" id="go">查询</button>
  {% if user and user.role == 'admin' %}
  <a class="btn sm" href="#" id="exportBtn">⬇️ 导出台账</a>
  <a class="btn sm" href="/api/export/register" download>📋 总登记账</a>
  <a class="btn sm" href="#" id="importBtn">⬆️ 导入Excel</a>
  <input type="file" id="importFile" accept=".xlsx" hidden>
  <a class="btn sm" href="/api/backup/db" download>💾 备份数据库</a>
  {% endif %}
</section>
<p class="hint"><a href="#" id="needPhotosLink">待补拍清单</a> · <span id="total"></span></p>
<section id="needPhotos" hidden></section>

<!-- 手机：单列大图卡片流 -->
<div id="cards" class="cards"></div>

<!-- 平板/PC：紧凑数据表格（对账友好） -->
<div class="tblwrap">
<table id="tbl">
  <thead><tr>
    <th>编号</th><th>名称</th><th>品类</th><th>系列</th><th>机构/券种</th>
    <th>纪年</th><th>评级</th><th>状态</th>
  </tr></thead>
  <tbody></tbody>
</table>
</div>
<div class="pager" id="pager"></div>

<script>
const $ = s => document.querySelector(s);
const STATUS = {draft:'草稿', in_stock:'在库', reviewing:'送评中', exhibited:'展出中',
  lent:'借出', retired:'注销', consigned:'寄售(历史)', sold:'已售(历史)', lost:'丢失'};
const PAGE = 50;
let page = 0, lastData = null;
const ADMIN = {{ 'true' if user and user.role == 'admin' else 'false' }};
const mq = window.matchMedia('(min-width: 760px)');   // ≥760px 切紧凑表格
const esc = s => String(s ?? '').replace(/[&<>"']/g,
  c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const chipHTML = s => `<span class="chip c-${esc(s)}">${STATUS[s]||esc(s)}</span>`;

async function j(url, opt){
  const r = await fetch(url, opt);
  if(r.status===401) return location='/login';
  return r.json();
}

async function loadStats(){
  const s = await j('/api/stats');
  const np = await j('/api/needs-photos');
  let bar = `<span>共 <b>${s.total}</b> 件</span>
     <span>在库/展出等 <b>${s.confirmed}</b></span>
     <span>草稿 <b>${s.draft}</b></span>
     <span>照片 <b>${s.photos}</b> 张</span>
     <span>凭证 <b>${s.attachments || 0}</b> 份</span>
     <span>缺照片 <b>${np.count}</b> 件</span>
     <span>导览浏览 <b>${s.pub_views || 0}</b> 次</span>`;
  if(s.est_total) bar += `<span>估值合计 <b>${Number(s.est_total).toLocaleString()}</b> 元</span>`;
  $('#statsbar').innerHTML = bar;
  const sec = $('#needPhotos'); sec.hidden = true; sec.dataset.loaded = '';
  $('#needPhotosLink').textContent = `待补拍清单（${np.count}）`;
  $('#needPhotosLink').onclick = (e) => {
    e.preventDefault();
    sec.hidden = !sec.hidden;
    if(!sec.hidden && !sec.dataset.loaded){
      sec.innerHTML = np.items.map(it =>
        `<div class="needsrow"><a href="/items/${it.id}">${esc(it.item_code) || ('草稿#'+it.id)}</a>
         ${esc(it.name)} <span class="hint">缺${it.missing.map(m=>m==='front'?'正面':'背面').join('、')}</span></div>`
      ).join('') || '<span class="hint">没有缺照片的藏品</span>';
      sec.dataset.loaded = 1;
    }
  };
}

async function fill(sel, type){
  const list = await j('/api/dict/' + type);
  for(const d of list){
    const op = document.createElement('option');
    op.value = d.name; op.textContent = d.name;
    sel.appendChild(op);
  }
}
async function fillLocs(sel){
  const locs = await j('/api/locations');
  for(const l of locs){
    const op = document.createElement('option');
    op.value = l.id; op.textContent = (l.parent_id ? '　└ ' : '') + l.name;
    sel.appendChild(op);
  }
}

function renderCards(items){
  const box = $('#cards');
  box.innerHTML = '';
  if(!items.length){ box.innerHTML = '<p class="hint">没有符合条件的藏品</p>'; return; }
  for(const it of items){
    const card = document.createElement('div');
    card.className = 'item-card';
    card.onclick = () => location = '/items/' + it.id;
    const thumb = it.thumb
      ? `<img class="thumb" src="${it.thumb}" loading="lazy" alt="">`
      : `<div class="thumb-empty">🪙</div>`;
    const chips = [chipHTML(it.status)];
    if(it.level) chips.push(`<span class="chip c-level">${esc(it.level)}</span>`);
    if(it.grade_co)
      chips.push(`<span class="chip c-grade">${esc(it.grade_co + (it.grade_raw ? ' ' + it.grade_raw : ''))}</span>`);
    const price = ADMIN && (it.est_value || it.purchase_price)
      ? `<span class="card-price">估值 ${Number(it.est_value || it.purchase_price).toLocaleString()} 元</span>` : '';
    card.innerHTML = `${thumb}
      <div class="body">
        <h3>${esc(it.name) || '未命名'}</h3>
        <div class="card-code">${esc(it.item_code)}${it.year_text ? ' · ' + esc(it.year_text) : ''}</div>
        <div class="card-meta">${chips.join('')}
          <span>${esc((it.bank||'') + (it.note_type ? ' ' + it.note_type : ''))}</span>${price}
        </div>
      </div>`;
    box.appendChild(card);
  }
}

function renderTable(items){
  const tb = $('#tbl tbody');
  tb.innerHTML = '';
  for(const it of items){
    const tr = document.createElement('tr');
    tr.style.cursor = 'pointer';
    tr.onclick = () => location = '/items/' + it.id;
    tr.innerHTML = `<td class="num">${esc(it.item_code)}</td><td>${esc(it.name)}</td>
      <td>${esc(it.category)}</td><td>${esc(it.series)}</td>
      <td>${esc((it.bank||'') + (it.note_type ? ' ' + it.note_type : ''))}</td>
      <td class="num">${esc(it.year_text)}</td>
      <td>${esc((it.grade_co||'') + (it.grade_raw ? ' ' + it.grade_raw : ''))}</td>
      <td>${chipHTML(it.status)}</td>`;
    tb.appendChild(tr);
  }
}

function render(){
  if(!lastData) return;
  renderCards(lastData.items);
  renderTable(lastData.items);
  const pages = Math.max(1, Math.ceil(lastData.total / PAGE));
  let html = '';
  if(pages > 1){
    if(page > 0) html += `<button class="mini" onclick="search(${page-1})">上一页</button> `;
    html += `第 ${page+1} / ${pages} 页`;
    if(page < pages-1) html += ` <button class="mini" onclick="search(${page+1})">下一页</button>`;
  }
  $('#pager').innerHTML = html;
}

async function search(p){
  if(p !== undefined) page = p;
  const params = new URLSearchParams();
  if($('#q').value) params.set('q', $('#q').value);
  if($('#fCategory').value) params.set('category', $('#fCategory').value);
  if($('#fSeries').value) params.set('series', $('#fSeries').value);
  if($('#fStatus').value) params.set('status', $('#fStatus').value);
  if($('#yFrom').value) params.set('year_from', $('#yFrom').value);
  if($('#yTo').value) params.set('year_to', $('#yTo').value);
  if($('#fLocation').value)
    params.set('location_id', $('#fLocation').value === 'none' ? -1 : $('#fLocation').value);
  if($('#fLevel').value) params.set('level', $('#fLevel').value);
  if($('#fsort').value) params.set('sort', $('#fsort').value);
  params.set('limit', PAGE);
  params.set('offset', page * PAGE);
  const d = await j('/api/items?' + params);
  $('#total').textContent = `共 ${d.total} 件`;
  lastData = d;
  render();
}
$('#go').onclick = () => search(0);
$('#q').onkeydown = e => { if(e.key==='Enter') search(0); };
$('#fLocation').onchange = () => search(0);
mq.addEventListener('change', render);

{% if user and user.role == 'admin' %}
$('#exportBtn').onclick = e => {
  e.preventDefault();
  const p = new URLSearchParams();
  if($('#q').value) p.set('q', $('#q').value);
  if($('#fCategory').value) p.set('category', $('#fCategory').value);
  if($('#fSeries').value) p.set('series', $('#fSeries').value);
  if($('#fStatus').value) p.set('status', $('#fStatus').value);
  if($('#yFrom').value) p.set('year_from', $('#yFrom').value);
  if($('#yTo').value) p.set('year_to', $('#yTo').value);
  if($('#fLocation').value)
    p.set('location_id', $('#fLocation').value === 'none' ? -1 : $('#fLocation').value);
  if($('#fsort').value) p.set('sort', $('#fsort').value);
  location.href = '/api/export/xlsx?' + p;
};
$('#importBtn').onclick = e => { e.preventDefault(); $('#importFile').click(); };
$('#importFile').onchange = async e => {
  const f = e.target.files[0];
  if(!f) return;
  if(!confirm('导入会跳过已存在的评级编号/内部编号，继续？')) { e.target.value=''; return; }
  const fd = new FormData();
  fd.append('file', f);
  const r = await fetch('/api/import/xlsx', {method:'POST', body: fd});
  if(r.status===401) return location='/login';
  const d = await r.json();
  if(d.ok){
    alert(`导入完成：新增 ${d.imported} 件，跳过 ${d.skipped} 件（已存在），失败 ${d.errors} 件`);
    search(page); loadStats();
  } else alert('导入失败：' + (d.detail || ''));
  e.target.value = '';
};
{% endif %}

Promise.all([fill($('#fCategory'),'category'), fill($('#fSeries'),'series'),
             fill($('#fLevel'),'item_level'), fillLocs($('#fLocation'))])
  .then(() => { search(0); loadStats(); });
</script>
{% endblock %}
