{% extends "base.html" %}
{% block content %}
<div class="page-head"><h2>库位管理</h2><p class="sub">库位按树形组织：展柜 → 层 → 盒。先建展柜（不选上级），再在展柜下建层和盒。
藏品在档案页选择库位，盘点按库位核对。</p></div>
<div class="filters addrow">
  <select class="input" id="parentId"><option value="">（作为顶层，如：某展柜）</option></select>
  <input class="input grow" id="name" placeholder="名称，如 一号展柜 / 第2层 / 钱币盒A">
  <input class="input" id="code" placeholder="编号（可选）" style="width:130px">
  <button class="btn primary" id="addBtn">➕ 添加库位</button>
</div>
<table id="tbl">
  <thead><tr><th>名称</th><th>上级</th><th>编号</th><th>藏品数</th><th>操作</th></tr></thead>
  <tbody></tbody>
</table>

<script>
const $ = s => document.querySelector(s);
let LOC = [];

async function j(url, opt){
  const r = await fetch(url, opt);
  if(r.status===401) return location='/login';
  if(r.status===403){ alert('权限不够'); return null; }
  const d = await r.json().catch(()=>null);
  if(d === null){ const raw = await r.text(); alert(raw || '操作失败'); return null; }
  return d;
}
function toast(msg){
  const d = document.createElement('div');
  d.className = 'toast'; d.textContent = msg;
  document.body.appendChild(d);
  setTimeout(()=>d.remove(), 3000);
}
const nameOf = id => (LOC.find(l => l.id === id) || {}).name || '';

async function load(){
  LOC = await j('/api/locations');
  const tb = $('#tbl tbody');
  tb.innerHTML = '';
  for(const l of LOC){
    const tr = document.createElement('tr');
    tr.innerHTML = `<td>${l.parent_id ? '　└ ' : ''}${l.name}</td>
      <td>${l.parent_id ? nameOf(l.parent_id) : '—'}</td>
      <td>${l.code||''}</td><td>${l.items}</td>
      <td><button class="mini" onclick="rename(${l.id})">改名</button>
          <button class="mini" onclick="del(${l.id}, ${l.items})">删</button></td>`;
    tb.appendChild(tr);
  }
  const sel = $('#parentId');
  const cur = sel.value;
  sel.innerHTML = '<option value="">（作为顶层，如：某展柜）</option>' +
    LOC.filter(l => !l.parent_id).map(l =>
      `<option value="${l.id}">${l.name}</option>`).join('');
  if(cur) sel.value = cur;
}
window.rename = async (id) => {
  const cur = nameOf(id);
  const name = prompt('新名称：', cur);
  if(!name || name === cur) return;
  const l = LOC.find(x => x.id === id);
  const d = await j('/api/locations/' + id, {method:'PUT',
    headers:{'Content-Type':'application/json'},
    body: JSON.stringify({name, parent_id: l.parent_id})});
  if(d){ toast('已改名'); load(); }
};
window.del = async (id, items) => {
  if(!confirm('删除该库位？')) return;
  const d = await j('/api/locations/' + id, {method:'DELETE'});
  if(d){ toast('已删除'); load(); }
};
$('#addBtn').onclick = async () => {
  if(!$('#name').value.trim()) return alert('名称必填');
  const d = await j('/api/locations', {method:'POST',
    headers:{'Content-Type':'application/json'},
    body: JSON.stringify({name: $('#name').value.trim(),
      parent_id: $('#parentId').value ? parseInt($('#parentId').value) : null,
      code: $('#code').value.trim() || null})});
  if(d){ toast('已添加'); $('#name').value=''; $('#code').value=''; load(); }
};
load();
</script>
{% endblock %}
