{% extends "base.html" %}
{% block content %}
<div class="page-head">
  <h2>库位与场馆平面图</h2>
  <p class="sub">平面格式图按编号展示所有展柜（C01/C02…），点击柜子下钻层与盒，直达藏品。
  层与盒的建议命名：「第1层」「钱币盒A」——编号体系 + 平面图双重定位。</p>
</div>

<!-- 场馆平面格式图 -->
<div class="card">
  <div class="card-head"><span>🏛️ 场馆平面格式图</span>
    <span class="hint" id="mapHint"></span></div>
  <div id="mapGrid" class="map-grid edit" style="grid-template-columns:repeat(8,1fr)"></div>
  <div class="filters" style="margin-top:10px">
    <button class="btn sm" id="layoutBtn">🔒 调整位置</button>
    <span class="hint" id="editHint">点击柜子下钻；点「调整位置」可自由摆放柜子（横柜/竖柜/回字形拼摆）</span>
  </div>
  <div id="shapeBar" class="filters" hidden
       style="background:var(--brand-soft);border-radius:var(--r-m);padding:8px 12px">
    <span class="lab" style="color:var(--brand-strong);font-weight:700" id="shapeName"></span>
    <span class="lab">宽</span>
    <button class="mini" onclick="resizeSpan(-1, 0)">−</button>
    <b class="num" id="spanW">1</b>
    <button class="mini" onclick="resizeSpan(1, 0)">＋</button>
    <span class="lab">高</span>
    <button class="mini" onclick="resizeSpan(0, -1)">−</button>
    <b class="num" id="spanH">1</b>
    <button class="mini" onclick="resizeSpan(0, 1)">＋</button>
    <button class="mini" onclick="rotateSpan()">↺ 横竖互换</button>
    <span class="hint">横柜=宽2、竖柜=高2；回字形用四段柜子拼摆</span>
  </div>
  <div id="mapDrill" class="map-drill" hidden></div>
</div>

<div class="card">
  <div class="card-head"><span>🛠 添加库位</span></div>
  <div class="filters">
    <select id="parentId" class="input"><option value="">（作为顶层展柜）</option></select>
    <input id="name" class="input grow" placeholder="名称，如 一号展柜 / 第2层 / 钱币盒A">
    <input id="code" class="input" placeholder="编号（留空自动 C01…）" style="width:150px">
    <button class="btn primary" id="addBtn">➕ 添加</button>
  </div>
  <table>
    <thead><tr><th>名称</th><th>编号</th><th>上级</th><th>藏品数</th><th>操作</th></tr></thead>
    <tbody id="treeBody"></tbody>
  </table>
</div>

<script>
const $ = s => document.querySelector(s);
let LOC = [];

async function j(url, opt){
  const r = await fetch(url, opt);
  if(r.status===401) return location='/login';
  if(r.status===403){ alert('权限不够'); return null; }
  const d = await r.json().catch(()=>null);
  if(d === null){ const raw = await r.text(); alert(raw || '操作失败'); return null; }
  return d;
}
function toast(msg){
  const d = document.createElement('div');
  d.className = 'toast'; d.textContent = msg;
  document.body.appendChild(d);
  setTimeout(()=>d.remove(), 3000);
}
const nameOf = id => (LOC.find(l => l.id === id) || {}).name || '';

/* ---------- 场馆平面格式图（固定网格 + 编辑摆放） ---------- */
const COLS = 8;
let editMode = false, pickId = null;

function renderMap(){
  const cabinets = LOC.filter(l => !l.parent_id && l.grid_x !== null);
  const orphan = LOC.filter(l => !l.parent_id && l.grid_x === null);
  const grid = $('#mapGrid');
  const maxY = Math.max(0, ...cabinets.map(l => (l.grid_y||0) + (l.grid_h||1) - 1));
  // 跨距：柜子占 w×h 格，其余格被覆盖时跳过
  const covered = new Set();
  for(const c of cabinets){
    const w = c.grid_w || 1, h = c.grid_h || 1;
    for(let dx = 0; dx < w; dx++)
      for(let dy = 0; dy < h; dy++)
        if(dx || dy) covered.add((c.grid_x + dx) + ',' + (c.grid_y + dy));
  }
  let cells = '';
  for(let y = 0; y <= maxY; y++){
    for(let x = 0; x < COLS; x++){
      if(covered.has(x + ',' + y)) continue;   // 被跨距柜覆盖
      const l = cabinets.find(c => c.grid_x === x && c.grid_y === y);
      if(l){
        const w = l.grid_w || 1, h = l.grid_h || 1;
        cells += `<div class="map-cell ${pickId===l.id?'picked':''}"
          style="grid-column:span ${w};grid-row:span ${h}"
          onclick="cellClick(${l.id})" title="${l.name}">
          <div class="map-code">${l.code || '未编号'}</div>
          <div class="map-name">${l.name}</div>
          <div class="map-count">${l.items} 件</div></div>`;
      } else {
        cells += `<div class="map-cell empty ${editMode?'editable':''}"
          onclick="cellClick(null, ${x}, ${y})"></div>`;
      }
    }
  }
  grid.innerHTML = cells;
  $('#mapHint').textContent = editMode
    ? `摆放中：先点柜子，再点目标格（有柜则互换）`
    : `${cabinets.length} 个展柜 · 点击柜子下钻`;
  // 孤儿柜（未分配格子的旧数据）自动补位
  if(orphan.length) autoPlace(orphan);
}

async function autoPlace(orphan){
  for(const l of orphan){
    const taken = new Set(
      LOC.filter(c => !c.parent_id && c.grid_x !== null)
         .map(c => c.grid_x + ',' + c.grid_y));
    let placed = false;
    for(let y = 0; y < 40 && !placed; y++){
      for(let x = 0; x < COLS && !placed; x++){
        if(!taken.has(x + ',' + y)){
          await j(`/api/locations/${l.id}/position`, {method:'PUT',
            headers:{'Content-Type':'application/json'},
            body: JSON.stringify({x, y})});
          l.grid_x = x; l.grid_y = y;
          placed = true;
        }
      }
    }
  }
  if(orphan.length) renderMap();
}

$('#layoutBtn').onclick = () => {
  editMode = !editMode;
  pickId = null;
  $('#layoutBtn').textContent = editMode ? '✅ 完成摆放' : '🔒 调整位置';
  $('#layoutBtn').classList.toggle('on', editMode);
  $('#editHint').textContent = editMode
    ? '先点要挪动的柜子，再点目标格——有柜子的格会互换位置'
    : '点击柜子下钻；点「调整位置」可自由摆放柜子';
  renderMap();
};

window.cellClick = async (id, x, y) => {
  if(!editMode){
    if(id) drill(id);
    return;
  }
  if(!id && pickId === null){
    toast('先点一个要挪动的柜子');
    return;
  }
  if(pickId === null){
    if(id === null) return;
    pickId = id;
    renderMap();
    return;
  }
  // pickId 已选：移动到 (x, y)
  const me = LOC.find(l => l.id === pickId);
  const r = await j(`/api/locations/${pickId}/position`, {method:'PUT',
    headers:{'Content-Type':'application/json'},
    body: JSON.stringify({x, y})});
  if(r && r.ok){
    if(me){ me.grid_x = x; me.grid_y = y; }
    const swapped = LOC.find(l => !l.parent_id && l.id !== pickId &&
      l.grid_x === x && l.grid_y === y);
    if(swapped && me){
      swapped.grid_x = me.grid_x; swapped.grid_y = me.grid_y;
    }
    pickId = null;
    renderMap();
    toast('已摆放');
  }
};

async function drill(id){
  if(editMode) return;
  const cab = LOC.find(l => l.id === id);
  const children = LOC.filter(l => l.parent_id === id);
  const drillBox = $('#mapDrill');
  drillBox.hidden = false;
  if(!children.length){
    drillBox.innerHTML = `<div class="drill-head"><b>${cab.code||''} ${cab.name}</b>
      <a class="btn sm" href="/items?location_id=${id}">查看该柜全部藏品（${cab.items} 件）→</a></div>
      <p class="hint">该展柜还没有分层/分盒——建议在下方添加「第1层」「第2层」，再在层下加盒子。</p>`;
    return;
  }
  const kids = children.map(ch => {
    const grand = LOC.filter(g => g.parent_id === ch.id);
    const cells = grand.length
      ? `<div class="map-grid small">${grand.map(g => `
          <div class="map-cell small" onclick="event.stopPropagation();viewLoc(${g.id})">
            <div class="map-code">${g.code || ''}</div>
            <div class="map-name">${g.name}</div>
            <div class="map-count">${g.items} 件</div>
          </div>`).join('')}</div>`
      : `<a class="btn sm" href="/items?location_id=${ch.id}">查看该层藏品（${ch.items} 件）→</a>`;
    return `<div class="drill-row">
      <div class="drill-head"><b>${ch.code ? ch.code + ' ' : ''}${ch.name}</b>
        <span class="hint">${ch.items} 件直接存放</span>
        <a class="btn sm ghost" href="/items?location_id=${ch.id}">全部藏品</a></div>
      ${cells}
    </div>`;
  }).join('');
  drillBox.innerHTML = `<div class="drill-head">
      <b>${cab.code||''} ${cab.name} 的内部结构</b>
      <a class="btn sm" href="/items?location_id=${id}">查看全部藏品（${cab.items} 件）→</a>
      <button class="mini" onclick="document.getElementById('mapDrill').hidden=true">收起</button></div>
    ${kids}`;
  drillBox.scrollIntoView({behavior:'smooth'});
}
function viewLoc(id){ location = '/items?location_id=' + id; }

/* ---------- 树形管理表格 ---------- */
async function load(){
  LOC = await j('/api/locations');
  const tb = $('#treeBody');
  tb.innerHTML = '';
  for(const l of LOC){
    const tr = document.createElement('tr');
    tr.innerHTML = `<td>${l.parent_id ? '　└ ' : ''}${l.name}</td>
      <td class="num">${l.code||''}</td>
      <td>${l.parent_id ? nameOf(l.parent_id) : '—'}</td>
      <td class="num">${l.items}</td>
      <td><button class="mini" onclick="rename(${l.id})">改名</button>
          <button class="mini del" onclick="del(${l.id})">删</button></td>`;
    tb.appendChild(tr);
  }
  const sel = $('#parentId');
  const cur = sel.value;
  sel.innerHTML = '<option value="">（作为顶层展柜）</option>' +
    LOC.filter(l => !l.parent_id).map(l =>
      `<option value="${l.id}">${l.name}</option>`).join('');
  if(cur) sel.value = cur;
  renderMap();
}
const _style = document.createElement('style');
_style.textContent = '.map-cell.picked{outline:3px solid var(--exh-gold);animation:pulse-gold 1s infinite}@keyframes pulse-gold{50%{outline-color:rgba(200,165,98,.25)}}.map-cell.empty{border:1.5px dashed rgba(205,168,105,.3);min-height:70px}.map-cell.empty.editable:hover{border-color:var(--exh-gold);background:rgba(200,165,98,.06)}';
document.head.appendChild(_style);
window.rename = async (id) => {
  const cur = nameOf(id);
  const name = prompt('新名称：', cur);
  if(!name || name === cur) return;
  const l = LOC.find(x => x.id === id);
  const d = await j('/api/locations/' + id, {method:'PUT',
    headers:{'Content-Type':'application/json'},
    body: JSON.stringify({name, parent_id: l.parent_id})});
  if(d){ toast('已改名'); load(); }
};
window.del = async (id) => {
  if(!confirm('删除该库位？')) return;
  const d = await j('/api/locations/' + id, {method:'DELETE'});
  if(d){ toast('已删除'); load(); }
};
$('#addBtn').onclick = async () => {
  if(!$('#name').value.trim()) return alert('名称必填');
  const d = await j('/api/locations', {method:'POST',
    headers:{'Content-Type':'application/json'},
    body: JSON.stringify({name: $('#name').value.trim(),
      parent_id: $('#parentId').value ? parseInt($('#parentId').value) : null,
      code: $('#code').value.trim() || null})});
  if(d){ toast('已添加' + (d.code ? `，编号 ${d.code}` : '')); $('#name').value=''; $('#code').value=''; load(); }
};
load();
</script>
{% endblock %}
